# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.

theme = "blowfish"
baseURL = "https://n9o.xyz/"
defaultContentLanguage = "en"
# disableLanguages = ['pt-pt']

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true
hasCJKLanguage = true

googleAnalytics = "G-R94R4YKFEC"

[pagination]
  pagerSize = 27

# Hide the 30 individual day posts of the vibe30 series from Recent / Highlights /
# /posts/ list pages. The announcement and wrapup remain visible because the glob
# only matches folder names starting with "day".
[[cascade]]
  type = "hidden"
  _target = { path = "/posts/202604-vibe30/day*" }

[params.author]
  name = "Nuno Coração"
  image = "img/bw_avatar.jpg"
  headline = "Principal PM @ Docker"
  subtitle = "🧠 Builder · AI, agents, infra · OSS · Mentor & startup advisor"
  bio = "Principal Product Manager @ Docker"
  links = [
    { email = "mailto:nuno@n9o.xyz" },
