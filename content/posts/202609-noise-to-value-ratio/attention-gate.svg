<style>
.nv1-n{fill:currentColor;fill-opacity:.45;animation:nv1-block linear infinite}
.nv1-p{animation-name:nv1-pass}
.nv1-v{fill:rgb(var(--color-primary-500, 74, 158, 240));animation:nv1-vblock linear infinite}
.nv1-v.nv1-p{animation-name:nv1-pass}
.nv1-ring{fill:none;stroke:rgb(var(--color-secondary-500, 240, 112, 90));stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:nv1-ring 2.4s ease-out infinite}
@keyframes nv1-block{0%{transform:translateX(0);opacity:0}8%{opacity:1}80%{opacity:1}100%{transform:translateX(420px);opacity:0}}
@keyframes nv1-vblock{0%{transform:translateX(0);opacity:0}8%{opacity:1}55%{transform:translateX(418px);opacity:1}88%{transform:translateX(418px);opacity:1}100%{transform:translateX(418px);opacity:0}}
@keyframes nv1-pass{0%{transform:translateX(0);opacity:0}6%{opacity:1}92%{opacity:1}100%{transform:translateX(590px);opacity:0}}
@keyframes nv1-ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.nv1 *{animation-play-state:paused!important}}
</style>
