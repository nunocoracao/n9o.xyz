<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" class="nv3" style="width:100%;height:auto" aria-hidden="true" focusable="false">
<style>
.nv3-slow{animation:nv3-slow 8s ease-in-out infinite}
.nv3-fast{animation:nv3-fast 3.2s ease-in infinite}
.nv3-pile{transform-box:fill-box;transform-origin:center;animation:nv3-wob 2.2s ease-in-out infinite alternate}
.nv3-spark{fill:rgb(var(--color-primary-500, 74, 158, 240));transform-box:fill-box;transform-origin:center;animation:nv3-spark 1.4s ease-in-out infinite alternate}
@keyframes nv3-slow{0%{transform:translate(120px,70px);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(590px,70px);opacity:0}}
@keyframes nv3-fast{0%{transform:translate(120px,186px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(360px,186px);opacity:0}}
@keyframes nv3-wob{from{transform:translateY(-1.5px)}to{transform:translateY(1.5px)}}
@keyframes nv3-spark{from{transform:scale(.7) rotate(0deg);opacity:.6}to{transform:scale(1.15) rotate(45deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.nv3 *{animation-play-state:paused!important}}
</style>
