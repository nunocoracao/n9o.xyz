<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" class="nv2" style="width:100%;height:auto" aria-hidden="true" focusable="false">
<style>
.nv2-n{fill:currentColor;fill-opacity:.4;animation:nv2-drift linear infinite}
.nv2-link{stroke:rgb(var(--color-primary-500, 74, 158, 240));stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round;animation:nv2-dash 1.6s linear infinite}
.nv2-ring{fill:none;stroke:rgb(var(--color-secondary-500, 240, 112, 90));stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:nv2-ring 3s ease-out infinite}
.nv2-m{fill:rgb(var(--color-primary-500, 74, 158, 240));animation:nv2-ab 3.2s ease-in-out infinite alternate}
.nv2-m2{animation-name:nv2-bc;animation-duration:3.8s}
.nv2-m3{animation-name:nv2-ca;animation-duration:3.5s}
@keyframes nv2-drift{0%{transform:translateX(-40px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(760px);opacity:0}}
@keyframes nv2-dash{to{stroke-dashoffset:-24}}
@keyframes nv2-ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes nv2-ab{from{transform:translate(360px,62px)}to{transform:translate(236px,176px)}}
@keyframes nv2-bc{from{transform:translate(236px,176px)}to{transform:translate(484px,176px)}}
@keyframes nv2-ca{from{transform:translate(484px,176px)}to{transform:translate(360px,62px)}}
@media (prefers-reduced-motion:reduce){.nv2 *{animation-play-state:paused!important}}
</style>
